name: Validate KPS knowledge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify knowledge links and structure
        run: python3 validate.py .
      - name: Run regression tests
        run: python3 -m unittest internal.tests.test_validate
      - name: Verify source alignment and migration declarations
        run: python3 -m unittest internal.tests.test_alignment
      - name: Check diagram metadata and regression behavior
        run: python3 -m unittest internal.tests.test_diagrams
      - name: Check Core-wide diagram audit
        run: python3 -m unittest internal.tests.test_diagram_audit
      - name: Install pinned D2 with verified digest
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  $RUNNER_TEMP/d2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-v0.9.0/bin" >> "$GITHUB_PATH"
      - name: Verify D2 sources match committed SVGs
        run: python3 -m internal.diagram_tools --check --root .
