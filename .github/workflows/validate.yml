name: Validate KPS knowledge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify knowledge links and structure
        run: python3 validate.py .
      - name: Run regression tests
        run: python3 test_validate.py
